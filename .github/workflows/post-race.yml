name: Automatic race weekend updates

on:
  schedule:
    # A cheap due-time check only. Full pipelines run once per completed session.
    - cron: '*/5 * * * *'
  workflow_dispatch:
    inputs:
      phase:
        description: 'Automatic schedule, or a manual pipeline (bypasses the delay)'
        required: true
        default: auto
        type: choice
        options: [auto, post_fp, post_quali, post_race]
      round:
        description: 'Optional internal round; round alone manually settles that race'
        required: false
        type: string
  push:
    branches: [master, codex/session-updates]
    paths:
      - '.github/workflows/post-race.yml'
      - 'pipeline/auto_weekend.py'
      - 'pipeline/auto_post_race.py'
      - 'pipeline/sync_post_race_official.py'
      - 'pipeline/bootstrap_result_history.py'
      - 'pipeline/run_weekend.py'
      - 'pipeline/06_run_predictions.py'
      - 'pipeline/08_export_website_json.py'
      - 'tests/test_auto_weekend.py'
      - 'tests/test_prediction_archive_immutability.py'
      - 'web/public/prediction-context.js'

permissions:
  contents: write

concurrency:
  group: automatic-race-weekend-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements.txt pytest
      - name: Verify schedule and publishing contracts
        run: |
          python -m pytest tests/test_auto_weekend.py tests/test_auto_post_race.py tests/test_run_weekend_phases.py tests/test_prediction_archive_immutability.py tests/test_fantasy_prices.py tests/test_post_race_classification.py -q
          node --test web/tests/prediction-context.test.js
      - name: Check the live schedule without running a pipeline
        run: python pipeline/auto_weekend.py --plan

  update-and-publish:
    needs: verify
    if: always() && github.ref == 'refs/heads/master' && (needs.verify.result == 'success' || needs.verify.result == 'skipped')
    runs-on: ubuntu-latest
    timeout-minutes: 50
    env:
      PYTHONUNBUFFERED: '1'
      MPLCONFIGDIR: ${{ github.workspace }}/.cache/matplotlib
      REQUESTED_PHASE: ${{ inputs.phase || 'auto' }}
      REQUESTED_ROUND: ${{ inputs.round }}
    steps:
      - name: Check out production branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: master
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Check whether a session update is due
        id: plan
        shell: bash
        run: |
          set -uo pipefail
          args=(--phase "$REQUESTED_PHASE")
          if [[ -n "$REQUESTED_ROUND" ]]; then
            if [[ ! "$REQUESTED_ROUND" =~ ^[0-9]+$ ]]; then
              echo 'Round must be an internal calendar number.' >&2
              exit 1
            fi
            args+=(--round "$REQUESTED_ROUND")
          fi
          python pipeline/auto_weekend.py --plan "${args[@]}"
          result=$?
          if [[ "$result" == 75 ]]; then
            echo 'due=false' >> "$GITHUB_OUTPUT"
            echo 'Session timing feed pending; the next schedule check will retry.' >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          exit "$result"
      - name: Restore downloaded race data
        if: steps.plan.outputs.due == 'true'
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            data/raw
            data/predictions
            data/processed/jolpica/normalized
          key: post-race-v1-${{ runner.os }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: post-race-v1-${{ runner.os }}-
      - name: Install pipeline dependencies
        if: steps.plan.outputs.due == 'true'
        run: python -m pip install -r requirements.txt pytest
      - name: Check publishing contracts
        if: steps.plan.outputs.due == 'true'
        run: |
          python -m pytest tests/test_auto_weekend.py tests/test_auto_post_race.py tests/test_run_weekend_phases.py tests/test_prediction_archive_immutability.py tests/test_fantasy_prices.py tests/test_post_race_classification.py -q
          node --test web/tests/prediction-context.test.js
      - name: Run the due or manually requested update
        if: steps.plan.outputs.due == 'true'
        id: update
        shell: bash
        run: |
          set -uo pipefail
          args=(--phase "$REQUESTED_PHASE")
          if [[ -n "$REQUESTED_ROUND" ]]; then args+=(--round "$REQUESTED_ROUND"); fi
          python pipeline/auto_weekend.py "${args[@]}"
          result=$?
          if [[ "$result" == 75 ]]; then
            echo 'ready=false' >> "$GITHUB_OUTPUT"
            echo 'Session/results data pending; nothing published. The next check retries.' >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          if [[ "$result" != 0 ]]; then exit "$result"; fi
          echo 'ready=true' >> "$GITHUB_OUTPUT"
      - name: Publish verified generated data
        if: steps.update.outputs.ready == 'true'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for path in data/seed data/automation data/processed/jolpica/model_rows data/processed/weather data/audit data/evaluation/prospective data/v13 web/public; do
            if [[ -e "$path" ]]; then git add -- "$path"; fi
          done
          if git diff --cached --quiet; then
            echo 'No verified changes to publish.' >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          git commit -m 'Publish scheduled race weekend update'
          for attempt in 1 2 3; do
            git fetch origin master
            git rebase origin/master
            if git push origin HEAD:master; then
              echo 'Verified update published; Vercel updates the website.' >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            sleep 5
          done
          exit 1
      - name: Report a failed update
        if: failure()
        run: echo 'Weekend update failed. No unverified outputs published. The next schedule check retries; inspect the failed step.' >> "$GITHUB_STEP_SUMMARY"

name: Automatic post-race update

on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:
    inputs:
      round:
        description: 'Optional internal calendar round (leave blank for automatic detection)'
        required: false
        type: string
  push:
    branches: [master]
    paths:
      - '.github/workflows/post-race.yml'
      - 'pipeline/auto_post_race.py'
      - 'pipeline/sync_post_race_official.py'
      - 'pipeline/bootstrap_result_history.py'
      - 'pipeline/run_weekend.py'

permissions:
  contents: write

concurrency:
  group: automatic-post-race-master
  cancel-in-progress: false

jobs:
  settle-and-publish:
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    timeout-minutes: 50
    env:
      PYTHONUNBUFFERED: '1'
      MPLCONFIGDIR: ${{ github.workspace }}/.cache/matplotlib
    steps:
      - name: Check out production branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: master
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Restore downloaded race data
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            data/raw
            data/predictions
            data/processed/jolpica/normalized
          key: post-race-v1-${{ runner.os }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: post-race-v1-${{ runner.os }}-

      - name: Install pipeline dependencies
        run: python -m pip install -r requirements.txt pytest

      - name: Check publishing contracts
        run: |
          python -m pytest tests/test_auto_post_race.py tests/test_run_weekend_phases.py tests/test_prediction_archive_immutability.py tests/test_fantasy_prices.py tests/test_post_race_classification.py -q
          node --test web/tests/prediction-context.test.js

      - name: Settle race and prepare the next forecast
        id: update
        env:
          REQUESTED_ROUND: ${{ inputs.round }}
        shell: bash
        run: |
          set -uo pipefail
          args=()
          if [[ -n "$REQUESTED_ROUND" ]]; then
            if [[ ! "$REQUESTED_ROUND" =~ ^[0-9]+$ ]]; then
              echo 'Round must be an internal calendar number.' >&2
              exit 1
            fi
            args+=(--round "$REQUESTED_ROUND")
          fi
          python pipeline/auto_post_race.py "${args[@]}"
          result=$?
          if [[ "$result" == 75 ]]; then
            echo 'ready=false' >> "$GITHUB_OUTPUT"
            echo 'Official data is pending; the next scheduled run will retry. No website changes published.' >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          if [[ "$result" != 0 ]]; then exit "$result"; fi
          echo 'ready=true' >> "$GITHUB_OUTPUT"

      - name: Publish verified generated data
        if: steps.update.outputs.ready == 'true'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for path in data/seed data/automation data/processed/jolpica/model_rows data/processed/weather data/audit data/evaluation/prospective data/v13 web/public; do
            if [[ -e "$path" ]]; then git add -- "$path"; fi
          done
          if git diff --cached --quiet; then
            echo 'No verified data changes to publish.' >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          git commit -m 'Settle completed race and prepare next forecast'
          # Weather and video jobs can publish while this longer job runs.
          # Rebase only when there is no conflict; never overwrite their work.
          for attempt in 1 2 3; do
            git fetch origin master
            git rebase origin/master
            if git push origin HEAD:master; then
              echo 'Verified race data published to master; the existing Vercel integration updates the website.' >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            sleep 5
          done
          echo 'Publishing failed after three attempts.' >&2
          exit 1

      - name: Report a failed update
        if: failure()
        run: echo 'Post-race update failed. No unverified outputs were published. Check the failed step; the next scheduled run will retry.' >> "$GITHUB_STEP_SUMMARY"

name: Notify paid members after a fresh simulation

on:
  # Deliberately manual. Weather, video, content and code deployments must never
  # email members. Run this only after publishing a new simulation phase.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger idempotent personalized simulation emails
        env:
          MEMBER_NOTIFICATION_SECRET: ${{ secrets.MEMBER_NOTIFICATION_SECRET }}
        run: |
          curl --fail-with-body --retry 3 --retry-all-errors \
            --request POST \
            --header "Authorization: Bearer ${MEMBER_NOTIFICATION_SECRET}" \
            --header "Content-Type: application/json" \
            --data '{"source":"manual_fresh_simulation"}' \
            https://boxboxf1fantasy.com/api/members/notify/
